function inf(){sheet('<h3>Tu dinero</h3><p class="mu">“Tienes” es el total: lo disponible más lo que apartaste en tus metas de ahorro. El balance del mes es lo que ingresó menos lo que gastaste en el mes elegido.</p><button class="go" onclick="cs()">Entendido</button>')}
function recs(){var g={};S.tx.forEach(function(x){if(x.a<0){var k=x.t.toLowerCase();g[k]=g[k]||{t:x.t,m:{},a:x.a,n:0};g[k].m[x.d.slice(0,7)]=1;g[k].n++}});
var q=Object.keys(g).map(function(k){return g[k]}).filter(function(o){return Object.keys(o.m).length>1});
sheet('<h3>Recurrentes</h3>'+(q.length?q.map(function(o){return'<div class="card flex"><span>'+esc(o.t)+'<br><span class="mu" style="margin:0">'+o.n+' veces</span></span><b>'+m$(o.a)+'</b></div>'}).join(''):'<p class="mu">Aún no hay cobros repetidos. Cuando un mismo comercio aparezca en meses distintos, lo verás aquí.</p>'))}
function view(){var h=hdr(),a=$('#app');document.body.className=tab=='ini'?'brown':'';
if(tab=='act'){h+='<div class="chips">';
[['Todo','grid'],['Regalos','gift'],['Restaurantes','fork'],['Transporte','car'],['Otros','dots']].forEach(function(c){var on=filt==c[0];h+='<button class="chip'+(on?' on':'')+'" onclick="setF(\''+c[0]+'\')">'+I(c[1],22)+(on&&c[0]=='Todo'?'Todo':on?c[0]:'')+'</button>'});
h+='</div><div class="lbl">Disponible</div><div class="big">'+m$(avail())+'</div><div class="acts"><button onclick="aho()">Ahorrar</button><button class="w" onclick="reg()">Registrar</button></div>'+list()}
else if(tab=='ini'){h+=ini()}else if(tab=='old'){var m=ago(0).slice(0,7),mt=S.tx.filter(function(x){return x.d.slice(0,7)==m}),ing=sum(mt.filter(function(x){return x.a>0}),function(x){return x.a}),gas=-sum(mt.filter(function(x){return x.a<0}),function(x){return x.a});
h+='<div class="lbl">Hola'+(S.name?', '+esc(S.name):'')+'</div><div class="big" style="font-size:48px">'+m$(avail())+'</div><div class="g2"><div class="card"><div class="mu" style="margin:0">Ingresos del mes</div><b class="pos" style="font-size:24px">+'+m$(ing)+'</b></div><div class="card"><div class="mu" style="margin:0">Gastos del mes</div><b style="font-size:24px">-'+m$(gas)+'</b></div></div><div class="card"><b style="font-size:21px">Gastos por categoría</b>';
CK.forEach(function(c){var v=mspent(c),p=gas?v/gas*100:0;h+='<div style="margin-top:16px"><div class="flex"><span style="color:'+CAT[c].c+'">'+c+'</span><span>'+m$(v)+'</span></div><div class="bar"><i style="width:'+p+'%;background:'+CAT[c].c+'"></i></div></div>'});
h+='</div><div class="day" style="margin-top:20px">Recientes</div>'+S.tx.slice().sort(function(p,r){return r.d>p.d?1:r.d<p.d?-1:r.id-p.id}).slice(0,4).map(rowH).join('')}
else if(tab=='aho'){h+='<h2>Ahorros</h2><div class="card"><div class="mu" style="margin:0">Total ahorrado</div><b style="font-size:34px">'+m$(sum(S.goals,function(g){return g.s}))+'</b></div>';
S.goals.forEach(function(g){var p=Math.min(100,g.t?g.s/g.t*100:0);h+='<div class="card" onclick="goal('+g.id+')"><div class="flex"><b style="font-size:21px">'+esc(g.n)+'</b><span>'+Math.round(p)+'%</span></div><div class="mu" style="margin:6px 0 0">'+m$(g.s)+' de '+m$(g.t)+'</div><div class="bar"><i style="width:'+p+'%"></i></div></div>'});
h+='<button class="go" onclick="ng()">Nueva meta</button>'}
else{h+='<h2>Límites</h2><p class="mu">Límite mensual por categoría. Toca uno para editarlo.</p>';
CK.forEach(function(c){var v=mspent(c),l=S.lim[c]||0,p=l?Math.min(100,v/l*100):0,o=l&&v>l;h+='<div class="card" onclick="lim(\''+c+'\')"><div class="flex"><span class="flex" style="gap:12px;color:'+CAT[c].c+'">'+I(CAT[c].i)+'<b style="color:#fff;font-size:21px;font-weight:500">'+c+'</b></span><span class="'+(o?'':'')+'" style="color:'+(o?'var(--red)':'#fff')+'">'+m$(v)+' / '+m$(l)+'</span></div><div class="bar"><i style="width:'+p+'%;background:'+(o?'var(--red)':p>80?'#f5c542':'var(--grn)')+'"></i></div></div>'})}
var y=a.scrollTop;a.innerHTML=h;a.scrollTop=y;
$('#tb').innerHTML=[['ini','home','Inicio'],['act','list','Actividad'],['aho','safe','Ahorros'],['lim','gauge','Límites']].map(function(t){return'<button class="'+(tab==t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+I(t[1])+t[2]+'</button>'}).join('');
$('.sb').innerHTML=I('search',32);bgc()}
function go(t){tab=t;view()}
function setF(c){filt=c;view()}
function sheet(h){$('#sh').innerHTML='<div class="bk" onclick="cs()"></div><div class="pn"><div class="gr"></div>'+h+'</div>';$('#sh').classList.add('on')}
function cs(){$('#sh').classList.remove('on')}
function reg(){F={t:'g',c:'Otros',a:'',n:'',d:ago(0)};regH()}
function regH(){sheet('<h3>Registrar movimiento</h3><div class="seg"><button class="'+(F.t=='g'?'on':'')+'" onclick="F.t=\'g\';regH()">Gasto</button><button class="'+(F.t=='i'?'on':'')+'" onclick="F.t=\'i\';regH()">Ingreso</button></div><input inputmode="numeric" placeholder="Monto" value="'+F.a+'" oninput="F.a=this.value"><input placeholder="Descripción" value="'+esc(F.n)+'" oninput="F.n=this.value"><div class="cats">'+CK.map(function(c){return'<button class="'+(F.c==c?'on':'')+'" onclick="F.c=\''+c+'\';regH()">'+c+'</button>'}).join('')+'</div><input type="date" value="'+F.d+'" onchange="F.d=this.value"><button class="go" onclick="regS()">Guardar</button>')}
function regS(){var a=parseInt(String(F.a).replace(/\D/g,''));if(!a){return}S.tx.push({id:S.nid++,t:F.n||F.c,c:F.c,a:F.t=='g'?-a:a,d:F.d||ago(0)});save();cs();tab='act';view()}
function det(id){var x=S.tx.filter(function(t){return t.id==id})[0];if(!x)return;var k=CAT[x.c]||CAT.Otros;
sheet('<div style="text-align:center;margin-bottom:18px"><div class="ico" style="margin:0 auto 12px;color:'+k.c+'">'+I(k.i)+'</div><b style="font-size:30px" class="'+(x.a>0?'pos':'')+'">'+(x.a>0?'+':'')+m$(x.a)+'</b></div><div class="card"><div class="flex"><span class="mu" style="margin:0">Descripción</span><span>'+esc(x.t)+'</span></div><div class="flex" style="margin-top:12px"><span class="mu" style="margin:0">Categoría</span><span>'+x.c+'</span></div><div class="flex" style="margin-top:12px"><span class="mu" style="margin:0">Fecha</span><span>'+dl(x.d)+'</span></div></div><button class="go d" onclick="del('+id+')">Eliminar</button>')}
function del(id){S.tx=S.tx.filter(function(t){return t.id!=id});save();cs();view()}
function aho(){F={g:S.goals[0]?S.goals[0].id:0,a:''};ahoH()}
function ahoH(){if(!S.goals.length){sheet('<h3>Ahorrar</h3><p class="mu">Primero crea una meta de ahorro.</p><button class="go" onclick="ng()">Nueva meta</button>');return}
sheet('<h3>Ahorrar</h3><p class="mu">Disponible: '+m$(avail())+'</p><div class="cats">'+S.goals.map(function(g){return'<button class="'+(F.g==g.id?'on':'')+'" onclick="F.g='+g.id+';ahoH()">'+esc(g.n)+'</button>'}).join('')+'</div><input inputmode="numeric" placeholder="Monto a ahorrar" value="'+F.a+'" oninput="F.a=this.value"><button class="go" onclick="ahoS()">Ahorrar</button>')}
function ahoS(){var a=parseInt(String(F.a).replace(/\D/g,'')),g=S.goals.filter(function(x){return x.id==F.g})[0];if(!a||!g||a>avail())return;g.s+=a;save();cs();view()}
function ng(){F={n:'',t:''};sheet('<h3>Nueva meta</h3><input placeholder="Nombre (ej. Viaje)" oninput="F.n=this.value"><input inputmode="numeric" placeholder="Monto objetivo" oninput="F.t=this.value"><button class="go" onclick="ngS()">Crear meta</button>')}
function ngS(){var t=parseInt(String(F.t).replace(/\D/g,''));if(!F.n||!t)return;S.goals.push({id:S.nid++,n:F.n,t:t,s:0});save();cs();tab='aho';view()}
function goal(id){var g=S.goals.filter(function(x){return x.id==id})[0];F={g:id,a:''};
sheet('<h3>'+esc(g.n)+'</h3><p class="mu">'+m$(g.s)+' de '+m$(g.t)+' · Disponible: '+m$(avail())+'</p><input inputmode="numeric" placeholder="Monto" oninput="F.a=this.value"><button class="go" onclick="gm(1)">Abonar</button><button class="go s" style="margin-top:10px" onclick="gm(-1)">Retirar</button><button class="go d" style="margin-top:10px" onclick="gd('+id+')">Eliminar meta</button>')}
function gm(s){var a=parseInt(String(F.a).replace(/\D/g,'')),g=S.goals.filter(function(x){return x.id==F.g})[0];if(!a)return;if(s>0&&a>avail())return;if(s<0&&a>g.s)return;g.s+=s*a;save();cs();view()}
function gd(id){S.goals=S.goals.filter(function(x){return x.id!=id});save();cs();view()}
function lim(c){F={c:c,v:''};sheet('<h3>Límite de '+c+'</h3><p class="mu">Actual: '+m$(S.lim[c]||0)+' al mes</p><input inputmode="numeric" placeholder="Nuevo límite" oninput="F.v=this.value"><button class="go" onclick="limS()">Guardar</button>')}
function limS(){var v=parseInt(String(F.v).replace(/\D/g,''));if(isNaN(v))return;S.lim[F.c]=v;save();cs();view()}
function bell(){var n=[];CK.forEach(function(c){var v=mspent(c),l=S.lim[c];if(l&&v>l)n.push('Superaste el límite de '+c+' ('+m$(v)+' de '+m$(l)+').');else if(l&&v>l*.8)n.push('Vas en '+Math.round(v/l*100)+'% del límite de '+c+'.')});
sheet('<h3>Notificaciones</h3>'+(n.length?n.map(function(t){return'<div class="card">'+t+'</div>'}).join(''):'<p class="mu">No tienes notificaciones.</p>'))}
function fil(){sheet('<h3>Filtros</h3><div class="mu">Ordenar por</div><div class="seg"><button class="'+(sort=='rec'?'on':'')+'" onclick="sort=\'rec\';fil();view()">Recientes</button><button class="'+(sort=='mon'?'on':'')+'" onclick="sort=\'mon\';fil();view()">Mayor monto</button></div><div class="mu">Tipo</div><div class="seg"><button class="'+(typ=='all'?'on':'')+'" onclick="typ=\'all\';fil();view()">Todos</button><button class="'+(typ=='g'?'on':'')+'" onclick="typ=\'g\';fil();view()">Gastos</button><button class="'+(typ=='i'?'on':'')+'" onclick="typ=\'i\';fil();view()">Ingresos</button></div><button class="go" onclick="cs()">Listo</button>')}
function menu(){F={b:''};sheet('<h3>Ajustes</h3><p class="mu">Saldo inicial actual: '+m$(S.base)+'</p><input inputmode="numeric" placeholder="Nuevo saldo inicial" oninput="F.b=this.value"><button class="go" onclick="bs()">Guardar saldo inicial</button><button class="go d" style="margin-top:10px" onclick="rs()">Restablecer datos</button>')}
function bs(){var v=parseInt(String(F.b).replace(/\D/g,''));if(isNaN(v))return;S.base=v;save();cs();view()}
function rs(){if(confirm('¿Borrar todos tus datos?')){S={base:0,name:S.name,nid:10,tx:[],goals:[],lim:{Regalos:0,Restaurantes:0,Transporte:0,Otros:0}};save();cs();view()}}
function prof(){F={n:S.name};sheet('<h3>Perfil</h3><input placeholder="Tu nombre" value="'+esc(S.name)+'" oninput="F.n=this.value"><button class="go" onclick="S.name=F.n;save();cs();view()">Guardar</button>')}
function srch(){sheet('<h3>Buscar</h3><input id="qi" placeholder="Busca por nombre o categoría" oninput="$(\'#qr\').innerHTML=list(this.value)"><div id="qr"></div>');var f=filt,t=typ;}
(function(){try{var c=document.createElement('canvas');c.width=c.height=512;var x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,512);g.addColorStop(0,'#9a6528');g.addColorStop(.55,'#3a280f');g.addColorStop(1,'#000');x.fillStyle=g;x.fillRect(0,0,512,512);
x.lineWidth=26;x.strokeStyle='#ff7a1a';x.beginPath();x.arc(256,256,150,0,7);x.stroke();
x.fillStyle='#fff';x.font='bold 210px -apple-system,Helvetica,Arial,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('$',256,270);
x.fillStyle='#30d158';x.beginPath();x.arc(362,150,24,0,7);x.fill();
$('#ati').href=c.toDataURL('image/png')}catch(e){}})();
(function(){try{var p=new URLSearchParams(location.search),m=p.get('m');if(m){var a=parseInt(String(m).replace(/[.,]\d{1,2}\s*$/,'').replace(/\D/g,''));if(a){var c=CAT[p.get('c')]?p.get('c'):'Otros';S.tx.push({id:S.nid++,t:p.get('t')||'Apple Pay',c:c,a:p.get('i')?a:-a,d:ago(0)});save()}history.replaceState(null,'',location.pathname)}}catch(e){}})();
function bgc(){document.documentElement.style.backgroundColor='#000'}
$('#app').addEventListener('scroll',bgc,{passive:true});
view();
</script>
